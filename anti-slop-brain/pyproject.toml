[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-slop-brain"
version = "0.1.0"
description = "Anti-Slop Brain Obsidian brain template and script layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Daniel Agrici"}]
dependencies = []

[project.scripts]
anti-slop-brain = "anti_slop_brain.cli:main"

[tool.setuptools]
packages = ["anti_slop_brain"]
